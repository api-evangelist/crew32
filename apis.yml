description: Crew32 was a stealth-stage technology startup based in Santa Monica, California, working
  in the human resources, employment, and workplace-culture space. It was founded by Jason Nazar (previously
  co-founder and CEO of Docstoc), George Ishii (co-founder of Betterworks, Geni, and Yammer), and Yadid
  Ramot, and raised roughly $5.8 million in early funding around 2016. The company is publicly associated
  with the comparably.com workplace-culture and compensation review platform. Crew32 was surfaced as a
  portfolio company of 500 Global and added to the API Evangelist network as a company lead; no public
  API, developer portal, or SDK has been identified for this company.
